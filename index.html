<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chave de Sinuca</title>
  <meta name="description" content="Gerador de chaveamento de dupla eliminatória para torneios de sinuca.">
  <meta name="theme-color" content="#35180f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23141414'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23fff'/%3E%3Ctext x='16' y='21' font-size='13' font-family='sans-serif' font-weight='700' text-anchor='middle'%3E7%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="rail">
    <div class="wrap rail-in">
      <h1 id="title">Chave de Sinuca</h1>
      <div class="rail-actions" id="actions" hidden>
        <button type="button" class="btn ghost" id="btn-share">Copiar link</button>
        <button type="button" class="btn ghost" id="btn-export">Salvar arquivo</button>
        <button type="button" class="btn ghost" id="btn-print">Imprimir</button>
        <button type="button" class="btn ghost" id="btn-new">Novo torneio</button>
      </div>
    </div>
    <div class="sights" aria-hidden="true"></div>
  </header>

  <div class="notice" id="shared" hidden>
    <div class="wrap notice-in">
      <span>Você está vendo uma cópia compartilhada deste torneio.</span>
      <button type="button" class="btn" id="btn-adopt">Editar neste aparelho</button>
      <button type="button" class="btn ghost" id="btn-leave">Fechar cópia</button>
    </div>
  </div>

  <main>
    <section id="setup" class="wrap" hidden>
      <form id="form" class="setup" novalidate>
        <div class="paper">
          <div class="field">
            <label for="f-name">Nome do torneio</label>
            <input id="f-name" maxlength="60" placeholder="Torneio de sexta" autocomplete="off">
          </div>
          <div class="field grow">
            <div class="label-row">
              <label for="f-players">Jogadores, um por linha</label>
              <button type="button" class="link" id="btn-sample">Usar exemplo</button>
            </div>
            <textarea id="f-players" rows="16" spellcheck="false" placeholder="Um nome por linha"></textarea>
          </div>
        </div>

        <div class="paper">
          <fieldset class="field">
            <legend>Posições na chave</legend>
            <label class="radio"><input type="radio" name="mode" id="mode-all" value="all" checked> Sorteio geral</label>
            <label class="radio"><input type="radio" name="mode" id="mode-seed" value="seed"> Cabeças de chave: os
              <input type="number" id="f-seeds" min="1" max="64" value="4" aria-label="Quantidade de cabeças de chave"> primeiros da lista</label>
            <label class="radio"><input type="radio" name="mode" id="mode-list" value="list"> Seguir a ordem da lista, sem sorteio</label>
          </fieldset>

          <fieldset class="field">
            <legend>Partidas por jogo</legend>
            <div class="cols">
              <label for="f-bow">Vencedores<select id="f-bow"></select></label>
              <label for="f-bol">Repescagem<select id="f-bol"></select></label>
              <label for="f-bof">Final<select id="f-bof"></select></label>
            </div>
          </fieldset>

          <fieldset class="field">
            <legend>Final</legend>
            <label class="radio"><input type="checkbox" id="f-reset" checked> Se o invicto perder, joga-se uma segunda final</label>
          </fieldset>

          <div class="field">
            <label for="f-tables">Mesas disponíveis</label>
            <input type="number" id="f-tables" min="1" max="20" value="2">
          </div>

          <p class="summary" id="summary" aria-live="polite"></p>
          <p class="error" id="error" role="alert" hidden></p>
          <button type="submit" class="btn primary big" id="btn-draw">Gerar chave</button>
          <button type="button" class="link" id="btn-import">Abrir torneio salvo</button>
          <input type="file" id="f-file" accept=".json,application/json" hidden>
        </div>
      </form>
    </section>

    <section id="event" hidden>
      <div class="wrap">
        <div class="champion" id="champion" hidden></div>
        <div class="bar">
          <div class="tabs" role="tablist" aria-label="Visualização">
            <button type="button" role="tab" id="tab-chave" aria-controls="p-chave">Chave</button>
            <button type="button" role="tab" id="tab-jogos" aria-controls="p-jogos">Jogos</button>
            <button type="button" role="tab" id="tab-geral" aria-controls="p-geral">Classificação</button>
          </div>
          <p class="progress" id="progress"></p>
        </div>
      </div>
      <div id="p-chave" role="tabpanel" aria-labelledby="tab-chave" class="scroller" tabindex="0"><div class="board" id="board"></div></div>
      <div id="p-jogos" role="tabpanel" aria-labelledby="tab-jogos" class="wrap"></div>
      <div id="p-geral" role="tabpanel" aria-labelledby="tab-geral" class="wrap"></div>
    </section>
  </main>

  <dialog id="dlg-match" aria-labelledby="dm-title">
    <form method="dialog" id="dm-form">
      <header class="dlg-head"><span id="dm-ball"></span><div><h2 id="dm-title"></h2><p id="dm-sub"></p></div></header>
      <div id="dm-players"></div>
      <label class="dm-mesa" for="dm-mesa">Mesa <select id="dm-mesa"></select></label>
      <p class="warn" id="dm-warn" hidden></p>
      <div class="dlg-actions">
        <button type="button" class="link" id="dm-clear">Apagar resultado</button>
        <span class="spacer"></span>
        <button type="button" class="btn quiet" id="dm-cancel">Cancelar</button>
        <button type="submit" class="btn primary" id="dm-save">Salvar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-ask" aria-labelledby="da-title">
    <form method="dialog" id="da-form">
      <h2 id="da-title"></h2>
      <p id="da-text"></p>
      <input id="da-input" maxlength="40" aria-labelledby="da-title" autocomplete="off" hidden>
      <p class="error" id="da-error" role="alert" hidden></p>
      <div class="dlg-actions">
        <span class="spacer"></span>
        <button type="button" class="btn quiet" id="da-cancel">Cancelar</button>
        <button type="submit" class="btn primary" id="da-ok">OK</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="js/bracket.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
